# Cell states along a cotinuum



### Jiadong Mao (MIG), Yidi Deng (ANU, Florey Institute)

### 6 May 2026

.footnote[
Modules 5-7: Φ-Space -&gt; pseudotime -&gt; NeighbourNet
]

---

class: section-slide, middle

&lt;div class="kicker"&gt;Afternoon arc&lt;/div&gt;

&lt;div class="claim"&gt;The afternoon session asks what we lose when we force continuous biology into discrete bins.&lt;/div&gt;

&lt;div class="flow"&gt;
  &lt;div class="flow-step"&gt;Module 5&lt;br&gt;soft phenotype scores&lt;/div&gt;
  &lt;div class="arrow"&gt;-&gt;&lt;/div&gt;
  &lt;div class="flow-step"&gt;Module 6&lt;br&gt;maturation ordering&lt;/div&gt;
  &lt;div class="arrow"&gt;-&gt;&lt;/div&gt;
  &lt;div class="flow-step"&gt;Module 7&lt;br&gt;network rewiring hypotheses&lt;/div&gt;
&lt;/div&gt;

???
Timing: 2 minutes. Tie back to Session 1: QC, integration, clustering, annotation, DE.

---

# The biological problem

&lt;div class="cols middle"&gt;
&lt;div&gt;
&lt;div class="kicker"&gt;Human heart development&lt;/div&gt;

* The dataset spans **foetal**, **young**, and **adult** heart samples.
* Cardiomyocyte maturation is not a set of clean bins.
* A hard label can be correct and still hide the gradient we care about.
&lt;/div&gt;

&lt;div class="panel"&gt;
&lt;h3&gt;Morning workflow&lt;/h3&gt;
&lt;p&gt;Cluster -&gt; marker genes -&gt; one label per cluster.&lt;/p&gt;
&lt;h3&gt;Afternoon question&lt;/h3&gt;
&lt;p&gt;Can we preserve gradual identity and use it for trajectory and network analysis?&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

???
Timing: 2 minutes. The core contrast is not that hard labels are bad; they are insufficient for this biological question.

---

# Module 5: Φ-Space turns labels into scores

&lt;div class="cols middle"&gt;
&lt;div&gt;
&lt;div class="claim"&gt;Ask “how much does this cell resemble each reference phenotype?” rather than “which single label wins?”&lt;/div&gt;

* Output: a **cells × phenotype scores** matrix.
* Scores can be collapsed to labels with `getClass()`.
* The reverse is impossible: labels cannot recover the original continuum.
&lt;/div&gt;

&lt;div class="panel"&gt;
&lt;h3&gt;Method sketch&lt;/h3&gt;
&lt;p&gt;Annotated reference expression `X` is mapped onto a dummy phenotype matrix `Y` using PLS regression.&lt;/p&gt;
&lt;p&gt;The fitted model is applied to query cells to produce `reducedDim(query, "PhiSpace")`.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

???
Timing: 3 minutes. Keep PLS high level: components maximize covariance between expression and phenotype labels.

---

# Φ-Space proof object

&lt;img src="afternoon_30min_xaringan_files/figure-html/phispace-proof-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

&lt;div class="caption"&gt;Use this slide to show that continuous phenotype scores retain developmental signal inside a cell type.&lt;/div&gt;

???
Timing: 3 minutes. Explain how to read the stage separation without over-interpreting PCA axes.

---

# Bridge: scores become a maturation coordinate

&lt;div class="cols middle"&gt;
&lt;div&gt;
&lt;div class="kicker"&gt;The payoff of Module 5&lt;/div&gt;

* The age scores give a biological anchor for direction.
* `pt_phi_score` is the trajectory-free baseline: adult-like score minus fetal score.
* Module 6 compares fitted pseudotimes against this simple maturation signal.
&lt;/div&gt;

&lt;div&gt;
&lt;img src="afternoon_30min_xaringan_files/figure-html/phispace-pt-umap-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;
&lt;/div&gt;
&lt;/div&gt;

???
Timing: 2 minutes. This is the hinge between Modules 5 and 6.

---

# Module 6: pseudotime is an ordering, not a clock

&lt;div class="cols middle"&gt;
&lt;div&gt;
&lt;div class="claim"&gt;Pseudotime assigns each cell a scalar position along a biological process.&lt;/div&gt;

* It is not real elapsed time.
* Its absolute scale is not identified.
* Direction must come from outside the method unless velocity is available.
&lt;/div&gt;

&lt;div class="panel"&gt;
&lt;h3&gt;In this workshop&lt;/h3&gt;
&lt;p&gt;The highest fetal Φ-Space score anchors the early end of the cardiomyocyte maturation trajectory.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

???
Timing: 2 minutes. Make sure participants do not treat pseudotime values as calendar time.

---

# Two method families, two kinds of uncertainty

&lt;div class="cols-3"&gt;
&lt;div class="panel"&gt;
&lt;h3&gt;Slingshot&lt;/h3&gt;
&lt;p&gt;Cluster centroids -&gt; minimum spanning tree -&gt; principal curves -&gt; arc-length pseudotime.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Main choice:&lt;/strong&gt; embedding and clustering.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="panel"&gt;
&lt;h3&gt;DPT via destiny&lt;/h3&gt;
&lt;p&gt;Cell-cell affinity graph -&gt; diffusion components -&gt; transition distance from a root.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Main choice:&lt;/strong&gt; embedding and root cell.&lt;/p&gt;
&lt;/div&gt;

&lt;div class="panel"&gt;
&lt;h3&gt;Velocity&lt;/h3&gt;
&lt;p&gt;Splicing dynamics estimate local time derivatives.&lt;/p&gt;
&lt;p&gt;&lt;strong&gt;Not run:&lt;/strong&gt; needs unspliced counts and has snRNA-seq caveats.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

???
Timing: 3 minutes. Mention velocity only as context; do not let it take over the talk.

---

# Slingshot sensitivity is the lesson

&lt;div class="cols middle"&gt;
&lt;div&gt;
&lt;div class="claim"&gt;For principal-curve methods, clustering is a modelling choice.&lt;/div&gt;

* Slingshot builds its tree on cluster centroids.
* Changing the clustering can move the trajectory even with the same cells.
* Module 6 therefore crosses two embeddings with two clusterings.
&lt;/div&gt;

&lt;div class="panel"&gt;
&lt;h3&gt;Four slingshot runs&lt;/h3&gt;
&lt;p&gt;Φ-Space or PCA embedding, crossed with Louvain or PhiCellType clustering.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

???
Timing: 3 minutes. This prepares participants to read the sensitivity grid in the vignette.

---

# Module 6 proof object

&lt;img src="afternoon_30min_xaringan_files/figure-html/pseudotime-proof-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

&lt;div class="caption"&gt;Rows separate method effects; columns separate embedding effects.&lt;/div&gt;

???
Timing: 4 minutes. The ideal result is broad agreement; disagreement is also useful because it exposes method sensitivity.

---

# Bridge: from gene levels to gene relationships

&lt;div class="cols middle"&gt;
&lt;div&gt;
&lt;div class="kicker"&gt;After pseudotime&lt;/div&gt;

* Differential expression asks: **which genes go up or down?**
* Network analysis asks: **which gene relationships change?**
* Along a continuum, one global network can average away rewiring.
&lt;/div&gt;

&lt;div class="panel"&gt;
&lt;h3&gt;Module 7 question&lt;/h3&gt;
&lt;p&gt;As cardiomyocytes mature, do transcription factors and target genes change how they co-vary locally?&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

???
Timing: 2 minutes. This is the transition into NeighbourNet.

---

# Module 7: co-expression scaffold, not causal GRN

&lt;div class="cols middle"&gt;
&lt;div&gt;
&lt;div class="claim"&gt;NeighbourNet builds cell-specific co-expression networks.&lt;/div&gt;

* Edges are local TF-target co-expression evidence.
* Prior knowledge can arrange receptor, TF, and target layers.
* The direction in the plot is biological context, not causality inferred from expression alone.
&lt;/div&gt;

&lt;div class="panel"&gt;
&lt;h3&gt;Interpretation rule&lt;/h3&gt;
&lt;p&gt;Use these networks as structured hypothesis generators. Causal claims need perturbation or external evidence.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

???
Timing: 3 minutes. This slide prevents over-claiming.

---

# NeighbourNet algorithm at high level

&lt;div class="flow"&gt;
  &lt;div class="flow-step"&gt;PCA&lt;br&gt;denoise cells&lt;/div&gt;
  &lt;div class="arrow"&gt;-&gt;&lt;/div&gt;
  &lt;div class="flow-step"&gt;kNN&lt;br&gt;local samples&lt;/div&gt;
  &lt;div class="arrow"&gt;-&gt;&lt;/div&gt;
  &lt;div class="flow-step"&gt;Local PC&lt;br&gt;regression&lt;/div&gt;
  &lt;div class="arrow"&gt;-&gt;&lt;/div&gt;
  &lt;div class="flow-step"&gt;Cell-specific&lt;br&gt;networks&lt;/div&gt;
  &lt;div class="arrow"&gt;-&gt;&lt;/div&gt;
  &lt;div class="flow-step"&gt;nPCA&lt;br&gt;meta-networks&lt;/div&gt;
&lt;/div&gt;

&lt;div class="cols middle" style="margin-top: 40px;"&gt;
&lt;div class="panel"&gt;
&lt;h3&gt;Computational shape&lt;/h3&gt;
&lt;p&gt;&lt;code&gt;cells × target genes × TF predictors&lt;/code&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;div class="panel"&gt;
&lt;h3&gt;Workshop constraint&lt;/h3&gt;
&lt;p&gt;Keep 10 maturation-associated target genes so the vignette remains feasible.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

???
Timing: 4 minutes. Keep this conceptual; participants will see the function-level workflow in the vignette.

---

# Module 7 proof object



&lt;img src="afternoon_30min_xaringan_files/figure-html/nnet-placeholder-1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

&lt;div class="caption"&gt;Recommended final figure: meta-network scores plus an adjacency heatmap or radial network plot from Module 7.&lt;/div&gt;

???
Timing: 4 minutes. Explain meta-network scores as PCA-like cell scores for recurring network patterns.

&lt;div class="claim"&gt;The afternoon workflow keeps continuous biology continuous long enough to ask better questions.&lt;/div&gt;

&lt;div class="flow"&gt;
