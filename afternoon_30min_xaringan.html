# Biological problem


- We have foetal, young and adult heart samples.
- Cardiomyocyte maturation is continuous.
- Often we care about gradients.


.panel[
### Morning workflow

Cluster -&gt; marker genes -&gt; one label per cluster.

### Afternoon question

Three ways of characterising cell state continuum: cell type scoring; pseudotime; cell-specific networks.
]



---

# Module 5: Φ-Space turns labels into scores

.cols.middle[
.col[
.claim[
How much does this cell resemble each reference phenotype?
]

* Output: a **cells × phenotype scores** matrix.
* Scores can be collapsed to labels with `getClass()`.
* Can handle multiple layers of phenotypes, ie cell type &amp; developmental stages.
]

.col[
.panel[
### Method sketch

Mapping gene expression `X` to a dummy phenotype matrix `Y` using PLS regression.

Fitted model applied to query cells to produce `reducedDim(query, "PhiSpace")`.
]

# Module 6: pseudotime 

.cols.middle[
.col[
.claim[
Pseudotime assigns each cell an inferred position along a biological process.
]

* It is not real elapsed time.
* Its absolute scale is not identified.
* Direction must come from input (except for RNA velocity methods).
]

.panel[
### In this workshop

Starting point: cells/clusters with highest fetal score.
]
]

---

# Three method families

.cols-3[
.panel[
### Slingshot

Cluster centroids -&gt; minimum spanning tree -&gt; principal curves -&gt; arc-length pseudotime.

**Main choice:** embedding, clustering, staring cluster.
]

.panel[
### Diffusion pseudotime (Destiny)

Cell-cell affinity graph -&gt; diffusion components -&gt; transition distance from a root.

**Main choice:** embedding, root cell.
]

.panel[
### Velocity

Splicing dynamics estimate local time derivatives.

**Not run:** Work on eg BAM files (splicing info), single-batach and snRNA-seq caveats.
]
]

---

# Slingshot sensitivity 

.cols.middle[
.col[
.claim[
For principal-curve methods, clustering is an important choice.
]

* Slingshot builds its tree on cluster centroids.
* Changing clustering moves trajectory, even for same cells.
* Try different two embeddings and clusterings.
]

.panel[
### Four pseudotime runs

Φ-Space or PCA embedding, slingshot or DPT.
]
]

# From gene expression levels to gene relationships

.cols.middle[
.col[
* Differential expression: **which genes go up or down?**
* Network analysis: **which gene relationships change?**
* Continuity: one global network can average away rewiring.
]

.panel[
### Module 7 question

As cardiomyocytes mature, do *co-expression* transcription factors and target genes change?

* Co-expression ≠ gene regulation
]
]


---

# Module 7: co-expression networks at cellular level


.claim[
NeighbourNet builds cell-specific co-expression networks.
]

* Local network: look at each cell and its neighbours (by default PCA space).
* Edges: significant local TF-target co-expression.
* Prior knowledge can be incorporated.
* Edge doesn't mean causality, but contains causality.


.panel[
### Interpretation rule

Use these networks as structured hypothesis generators. Causal claims need perturbation or external evidence.
]
